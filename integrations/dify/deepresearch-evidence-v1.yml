            "title": "Combine Evidence v1",
            "desc": "",
            "type": "code",
            "selected": false,
            "code": "SAFE_TOOL_CODES = {\"WEB_SEARCH_NOT_CONFIGURED\", \"WEB_SEARCH_PROVIDER_UNAVAILABLE\",\n    \"WEB_SEARCH_PROVIDER_AUTH_FAILED\", \"WEB_SEARCH_RATE_LIMITED\", \"WEB_SEARCH_TIMEOUT\",\n    \"TOOL_UNAVAILABLE\", \"INVALID_ARGUMENT\", \"TOOL_BUDGET_EXCEEDED\", \"CALL_ID_CONFLICT\",\n    \"RESULT_UNKNOWN\", \"RESULT_TOO_LARGE\", \"DIFY_TOOL_TRANSPORT_ERROR\", \"DIFY_TOOL_RESPONSE_INVALID\"}\nimport re\n\ndef quote_options(content):\n    # Only whole bounded clauses/paragraphs of the authorized snapshot. Never\n    # turn a dangling tail of a long sentence into a selectable quote.\n    if not isinstance(content, str) or not 1 <= len(content) <= 2000:\n        raise ValueError(\"invalid snapshot text\")\n    options, pending, start = [], \"\", 0\n    ends = [match.end() for match in re.finditer(r\"。|[;；]|[!?！？](?:\\s|$)|\\.(?:\\s|$)|\\n\\n\", content)]\n    for stop in ends + [len(content)]:\n        part, start = content[start:stop], stop\n        if len(part) > 300 or len(pending + part) > 300:\n            if len(pending.strip()) >= 2:\n                options.append({\"quoteId\": \"q\" + str(len(options) + 1), \"quote\": pending})\n            pending = \"\"\n        if len(part) <= 300:\n            pending += part\n    if len(pending.strip()) >= 2:\n        options.append({\"quoteId\": \"q\" + str(len(options) + 1), \"quote\": pending})\n    return options[:16]\n\ndef model_context(evidence, values):\n    return json.dumps({\"evidences\": [{key: value for key, value in item.items() if key != \"content\"}\n        | {\"quoteOptions\": quote_options(item[\"content\"])} for item in evidence],\n        \"toolValues\": values}, ensure_ascii=False)\nimport json\n\ndef main(results: list) -> dict:\n    out = {\"status\": \"FAILED\", \"error_code\": \"DIFY_TOOL_RESPONSE_INVALID\", \"context\": \"{}\", \"model_context\": \"{}\", \"count\": 0, \"answer\": \"\", \"citations\": [], \"usage\": {}}\n    try:\n        if not isinstance(results, list) or not 1 <= len(results) <= 4:\n            return out\n        seen = set()\n        evidence = []\n        values = []\n        saw_web = False\n        for raw in results:\n            row = json.loads(raw)\n            saw_web = row.get(\"tool\") == \"web_search\" or saw_web\n            if row[\"status\"] != \"OK\":\n                code = row.get(\"error_code\")\n                out[\"error_code\"] = code if code in SAFE_TOOL_CODES else \"DIFY_TOOL_RESPONSE_INVALID\"\n                return out\n            for item in row[\"evidences\"]:\n                cid = item[\"citationId\"]\n                if cid not in seen:\n                    seen.add(cid)\n                    evidence.append(item)\n            if row[\"value\"]:\n                values.append({\"tool\": row[\"tool\"], \"value\": row[\"value\"]})\n        evidence = evidence[:16]\n        for index, item in enumerate(evidence, 1):\n            item[\"sourceId\"] = \"来源\" + str(index)\n        out.update(status=\"READY\" if evidence else \"INSUFFICIENT_EVIDENCE\",\n                   error_code=\"\" if evidence else (\"WEB_SEARCH_NO_RESULTS\" if saw_web else \"NO_RELEVANT_EVIDENCE\"), context=json.dumps({\"evidences\": evidence, \"toolValues\": values}, ensure_ascii=False), model_context=model_context(evidence, values), count=len(results))\n    except (ValueError, TypeError, KeyError, AttributeError):\n        pass\n    return out\n\n_checked_main = main\n\ndef main(**inputs):\n    result = _checked_main(**inputs)\n    result['diagnostic_node'] = '' if result.get('status') == 'FAILED' else ''\n    return result\n",

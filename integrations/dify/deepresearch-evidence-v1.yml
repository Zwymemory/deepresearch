f saw_web else \"NO_RELEVANT_EVIDENCE\"), context=json.dumps({\"evidences\": evidence, \"toolValues\": values}, ensure_ascii=False))\n    except (ValueError, TypeError, KeyError, AttributeError):\n        pass\n    return out\n",

            "code": "import json\n\ndef unique_object(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            raise ValueError(\"duplicate JSON key\")\n        result[key] = value\n    return result\n\ndef invalid_constant(value):\n    raise ValueError(\"non-finite JSON constant\")\n\ndef exact_fields(value, fields):\n    if not isinstance(value, dict) or set(value) != set(fields):\n        raise ValueError(\"unexpected object fields\")\n\nclass ModelOutputError(ValueError):\n    def __init__(self, code):\n        self.code = code\n        super().__init__(code)\n\ndef parse_llm_json(text: str, finish_reason: str = \"stop\"):\n    # DeepSeek can prefix the answer with exactly one complete reasoning block.\n    # Everything after it must be one JSON object, with no prose or fences.\n    if finish_reason == \"provider_error\":\n        raise ModelOutputError(\"DIFY_MODEL_PROVIDER_ERROR\")\n    if finish_reason == \"length\":\n        raise ModelOutputError(\"DIFY_MODEL_OUTPUT_TRUNCATED\")\n    value = text.strip()\n    if value.startswith(\"<think>\"):\n        if value.count(\"<think>\") != 1 or value.count(\"</think>\") != 1:\n            raise ValueError(\"invalid reasoning wrapper\")\n        end = value.find(\"</think>\")\n        value = value[end + len(\"</think>\"):].strip()\n    if not value:\n        raise ModelOutputError(\"DIFY_MODEL_OUTPUT_EMPTY\")\n    if not value.startswith(\"{\"):\n        raise ValueError(\"expected JSON object\")\n    parsed = json.loads(value, object_pairs_hook=unique_object, parse_constant=invalid_constant)\n    if not isinstance(parsed, dict):\n        raise ValueError(\"expected JSON object\")\n    return parsed\nimport re\n\nPRIVATE_CONTACT = re.compile(r\"(?is)(私人|个人|private|personal).{0,80}(手机号|手机号码|邮箱|联系方式|phone|email|contact)\")\nCREDENTIAL = re.compile(r\"(?i)JWT|密钥|签名密钥|口令|密码|API[ _-]?Key|Bearer[ _-]?Token|secret|signing[ _-]?key\")\nRAW_VALUE = re.compile(r\"(?is)原文|原始值|实际值|具体值|(?:输出|给出).{0,80}(密钥|口令|密码|JWT)|\\b(raw|actual|current|production)\\b.{0,80}\\b(secret|key|password|token)\\b\")\n\ndef public_boundary_query(question):\n    if PRIVATE_CONTACT.search(question):\n        return \"公开项目知识包的资料范围说明：是否包含私人联系方式、手机号或个人邮箱；只检索公开边界说明，不检索任何联系方式值。\"\n    if CREDENTIAL.search(question) and RAW_VALUE.search(question):\n        return \"公开项目知识包的资料范围说明：是否包含 JWT 签名密钥、API Key 或数据库口令原文；只检索公开边界说明，不检索任何秘密值。\"\n    return None\nimport re\n\nGENERIC_SUBJECTS = {\"项目\", \"文档\", \"资料\", \"生产\", \"生产环境\", \"系统\", \"知识库\", \"知识包\",\n                    \"信息\", \"敏感信息\", \"信息边界\", \"密钥\", \"凭据\", \"deepresearch\", \"deepresearch项目\",\n                    \"project\", \"production\", \"documentation\", \"documents\", \"data\", \"information\",\n                    \"sensitive information\", \"secret\", \"secrets\", \"key\", \"credentials\", \"knowledgebase\"}\nNEGATED_LIST = re.compile(r\"(?:不(?:包含|含有|包括|提供|支持|记录)|未(?:实现|提供|记录|部署)|尚未(?:实现|提供|部署)|没有(?:实现|部署|包含|提供|记录)?)([^。，,；;!?！？\\n]+)\")\nENGLISH_NEGATED_LIST = re.compile(r\"(?i)\\b(?:do(?:es)?\\s+not|did\\s+not|not)\\s+(?:contain|include|store|record|support|implement|provide)\\s+([^.;!?\\n]+)\")\nENGLISH_CLAUSE = re.compile(r\"(?i)\\b(?:but|however|whereas|is|are|was|were|has|have|does|can|will)\\b\")\nCHINESE_CLAUSE = re.compile(r\"但|却|然而|而是|不过|同时|仍|另外|已记录|已公开\")\nDENIAL_PREFIX = re.compile(r\"(?i)^\\s*(?:无法|不能提供|未提供|没有依据|无证据|未能|不清楚|(?:知识库|资料|文档|知识包).{0,40}(?:不包含|不存在|未提供|没有)|cannot\\b|unable\\b|not available\\b)\")\n\ndef compact(value):\n    value = re.sub(r\"(?i)(?<![a-z0-9])k8s(?![a-z0-9])\", \"Kubernetes\", value)\n    return re.sub(r\"\\s+\", \"\", value).casefold()\n\ndef requested_subject(subject, question):\n    term = compact(subject)\n    if term in {compact(item) for item in GENERIC_SUBJECTS}:\n        return False\n    if term in compact(question):\n        return True\n    if term == \"jwt签名密钥\" and re.search(r\"(?i)JWT\", question) and CREDENTIAL.search(question) and RAW_VALUE.search(question):\n        return True\n    # The public corpus uses the contact-category synonym, not individual values.\n    return term == \"联系方式\" and PRIVATE_CONTACT.search(question) is not None\n\ndef explicit_negative_scope(subject, quote):\n    term = compact(subject)\n    for match in NEGATED_LIST.finditer(quote):\n        scope = match.group(1)\n        if not CHINESE_CLAUSE.search(scope) and term in compact(scope):\n            return True\n    for match in ENGLISH_NEGATED_LIST.finditer(quote):\n        scope = match.group(1)\n        # Reject a second predicate/contrast instead of guessing its negation scope.\n        if not ENGLISH_CLAUSE.search(scope) and term in compact(scope):\n            return True\n    return False\n\ndef boundary_supported(proofs, question, evidence, marked_sources=None):\n    if not 1 <= len(proofs) <= 8:\n        return False\n    sources = {item[\"sourceId\"]: item for item in evidence}\n    for proof in proofs:\n        exact_fields(proof, (\"subject\", \"quote\", \"sourceId\"))\n        if any(not isinstance(proof[key], str) for key in proof):\n            raise ValueError(\"invalid boundary proof type\")\n        subject, quote, source = proof[\"subject\"].strip(), proof[\"quote\"].strip(), proof[\"sourceId\"]\n        if not 2 <= len(subject) <= 100 or not 2 <= len(quote) <= 400 or source not in sources:\n            return False\n        if marked_sources is not None and source not in marked_sources:\n            return False\n        if not requested_subject(subject, question):\n            return False\n        # Whitespace folding accommodates rendering; no quote or JSON repair occurs.\n        if \" \".join(quote.split()) not in \" \".join(str(sources[source].get(\"content\") or \"\").split()):\n            return False\n        if not explicit_negative_scope(subject, quote):\n            return False\n    return True\n\ndef support_shape(response):\n    kind, proofs = response[\"answer_kind\"], response[\"boundary_support\"]\n    if kind not in (\"ANSWER\", \"DOCUMENTED_BOUNDARY\", \"NONE\") or not isinstance(proofs, list):\n        raise ValueError(\"invalid support shape\")\n    if kind != \"DOCUMENTED_BOUNDARY\" and proofs:\n        raise ValueError(\"unexpected boundary proof\")\n    return kind, proofs\nimport re\n\ndef quote_options(content):\n    # Only whole bounded clauses/paragraphs of the authorized snapshot. Never\n    # turn a dangling tail of a long sentence into a selectable quote.\n    if not isinstance(content, str) or not 1 <= len(content) <= 2000:\n        raise ValueError(\"invalid snapshot text\")\n    options, pending, start = [], \"\", 0\n    ends = [match.end() for match in re.finditer(r\"。|[;；]|[!?！？](?:\\s|$)|\\.(?:\\s|$)|\\n\\n\", content)]\n    for stop in ends + [len(content)]:\n        part, start = content[start:stop], stop\n        if len(part) > 300 or len(pending + part) > 300:\n            if len(pending.strip()) >= 2:\n                options.append({\"quoteId\": \"q\" + str(len(options) + 1), \"quote\": pending})\n            pending = \"\"\n        if len(part) <= 300:\n            pending += part\n    if len(pending.strip()) >= 2:\n        options.append({\"quoteId\": \"q\" + str(len(options) + 1), \"quote\": pending})\n    return options[:16]\n\ndef model_context(evidence, values):\n    return json.dumps({\"evidences\": [{key: value for key, value in item.items() if key != \"content\"}\n        | {\"quoteOptions\": quote_options(item[\"content\"])} for item in evidence],\n        \"toolValues\": values}, ensure_ascii=False)\ndef quote_context(source, quote):\n    # Keep the actual snapshot order. Never join search fragments across [...].\n    content = source[\"content\"]\n    start = content.find(quote)\n    if start < 0:\n        raise ValueError(\"quote missing from source\")\n    left, right = max(0, start - 150), min(len(content), start + len(quote) + 150)\n    return {\"sourceId\": source[\"sourceId\"], \"title\": (source.get(\"title\") or \"\")[:200],\n            \"content\": content[left:right], \"quoteStart\": start - left,\n            \"quoteEnd\": start - left + len(quote),\n            \"prefixClipped\": left > 0, \"suffixClipped\": right < len(content)}\n\ndef api_level_supported(claim, sources):\n    # Necessary lexical evidence for a claimed API level, not semantic proof.\n    # Match the modifier attached to API, not high-level network/workload prose.\n    patterns = (\n        r\"(?:高层(?:级)?|高级)(?:的)?\\s*(?:API|接口)|(?:high(?:er)?[-\\s]+level)\\s+(?:APIs?|interfaces?)\",\n        r\"(?:低层(?:级)?|底层)(?:的)?\\s*(?:API|接口)|(?:low(?:er)?[-\\s]+level)\\s+(?:APIs?|interfaces?)\",\n    )\n    for pattern in patterns:\n        if not re.search(pattern, claim[\"text\"], re.IGNORECASE):\n            continue\n        # Context is recomputed from the authorized candidate snapshot. Titles,\n        # other claims/sources and a model-supplied context never enter this gate.\n        bodies = [quote_context(sources[proof[\"sourceId\"]], proof[\"quote\"])[\"content\"]\n                  for proof in claim[\"quotes\"]]\n        segments = [part for body in bodies for part in body.split(\"[...]\")]\n        if not any(re.search(pattern, body, re.IGNORECASE) for body in segments):\n            return False\n    return True\ndef main(candidate: str, verification_text: str, question: str, finish_reason: str = \"stop\") -> dict:\n    out = {\"status\": \"FAILED\", \"error_code\": \"DIFY_MODEL_OUTPUT_INVALID\",\n           \"answer\": \"\", \"citations\": [], \"usage\": {}}\n    try:\n        data = json.loads(candidate)\n        claims, evidence = data[\"claims\"], data[\"evidences\"]\n        result = parse_llm_json(verification_text, finish_reason)\n        exact_fields(result, (\"decisions\", \"coverage\"))\n        decisions = result[\"decisions\"]\n        if not isinstance(decisions, list) or len(decisions) != len(claims):\n            return out\n        approved = set()\n        for index, decision in enumerate(decisions, 1):\n            exact_fields(decision, (\"index\", \"supported\"))\n            if type(decision[\"index\"]) is not int or decision[\"index\"] != index or type(decision[\"supported\"]) is not bool:\n                return out\n            if decision[\"supported\"]:\n                approved.add(index)\n        coverage = result[\"coverage\"]\n        if not isinstance(coverage, list) or len(coverage) != len(data[\"requirements\"]):\n            return out\n        complete, used = bool(approved), set()\n        for index, part in enumerate(coverage, 1):\n            exact_fields(part, (\"requirement_index\", \"claim_indices\"))\n            indices = part[\"claim_indices\"]\n            if type(part[\"requirement_index\"]) is not int or part[\"requirement_index\"] != index:\n                return out\n            if not isinstance(indices, list) or len(indices) > 6 or any(type(i) is not int or i not in approved for i in indices):\n                return out\n            if len(set(indices)) != len(indices):\n                return out\n            complete = complete and bool(indices)\n            used.update(indices)\n        if not complete:\n            out.update(status=\"INSUFFICIENT_EVIDENCE\", error_code=\"CLAIM_SUPPORT_INSUFFICIENT\")\n            return out\n        selected = [claim for index, claim in enumerate(claims, 1) if index in approved and index in used]\n        source_order = list(dict.fromkeys(proof[\"sourceId\"] for claim in selected for proof in claim[\"quotes\"]))\n        sources = {item[\"sourceId\"]: item for item in evidence}\n        if any(not api_level_supported(claim, sources) for claim in selected):\n            out.update(status=\"INSUFFICIENT_EVIDENCE\", error_code=\"CLAIM_SUPPORT_INSUFFICIENT\")\n            return out\n        if data[\"answer_kind\"] == \"DOCUMENTED_BOUNDARY\" and not boundary_supported(\n                data[\"boundary_support\"], question, evidence, set(source_order)):\n            out.update(status=\"INSUFFICIENT_EVIDENCE\", error_code=\"CLAIM_SUPPORT_INSUFFICIENT\")\n            return out\n        # No model-provided prose survives outside a separately approved claim.\n        labels = {source: \"[来源\" + str(index) + \"]\" for index, source in enumerate(source_order, 1)}\n        answer = \"\\n\".join(claim[\"text\"].strip() + \" \" + \"\".join(\n            labels[proof[\"sourceId\"]] for proof in claim[\"quotes\"]) for claim in selected)\n        citations = [sources[source][\"citationId\"] for source in source_order]\n        if not answer.strip() or len(answer) > 800 or not 1 <= len(citations) <= 8 or len(set(citations)) != len(citations):\n            return out\n        out.update(status=\"SUCCEEDED\", error_code=\"\", answer=answer, citations=citations)\n    except ModelOutputError as exc:\n        out[\"error_code\"] = exc.code\n    except (ValueError, TypeError, KeyError, AttributeError):\n        pass\n    return out\n\n_checked_main = main\n\ndef main(**inputs):\n    result = _checked_main(**inputs)\n    result['diagnostic_node'] = 'support_checker' if result.get('status') == 'FAILED' else ''\n    return result\n",

      zIndex: 1002
    - data:
        code: "import json\nimport re\n\nID = re.compile(r\"^kb:ragflow:[^:\\s]+:[^:\\\
          s]+:[^:\\s]+$\")\n\ndef main(status_code: int, body: str, tool: str) ->\
          \ dict:\n    result = {\"result\": json.dumps({\"status\": \"FAILED\", \"\
          tool\": tool, \"evidences\": [], \"value\": \"\"}, ensure_ascii=False)}\n\
          \    try:\n        data = json.loads(body)\n        if status_code != 200\
          \ or data.get(\"success\") is not True or data.get(\"code\") != \"OK\" or\
          \ data.get(\"tool\") != tool:\n            return result\n        rows =\
          \ data.get(\"evidences\", [])\n        if not isinstance(rows, list) or\
          \ len(rows) > 16:\n            return result\n        evidence = []\n  \
          \      if tool == \"kb_search\":\n            for row in rows:\n       \
          \         cid = row.get(\"citationId\")\n                content = row.get(\"\
          content\")\n                if not isinstance(cid, str) or not ID.fullmatch(cid)\
          \ or row.get(\"untrusted\") is not True or not isinstance(content, str):\n\
          \                    return result\n                evidence.append({\"\
          citationId\": cid, \"title\": str(row.get(\"title\") or \"\")[:200], \"\
          content\": content[:2000], \"untrusted\": True})\n        elif rows:\n \
          \           # Only normalized knowledge chunks can become source citations.\n\
          \            return result\n        value = data.get(\"value\")\n      \
          \  if value is None:\n            value = \"\"\n        if not isinstance(value,\
          \ str):\n            return result\n        result[\"result\"] = json.dumps({\"\
          status\": \"OK\", \"tool\": tool, \"evidences\": evidence, \"value\": value[:1000]},\
          \ ensure_ascii=False)\n    except (ValueError, TypeError, AttributeError):\n\
          \        pass\n    return result\n"
        code_language: python3
        desc: ''

    - data:
        code: "import json\n\ndef parse_llm_json(text: str):\n    # DeepSeek can prefix\
          \ the answer with exactly one complete reasoning block.\n    # Everything\
          \ after it must be one JSON object, with no prose or fences.\n    value\
          \ = text.strip()\n    if value.startswith(\"<think>\"):\n        if value.count(\"\
          <think>\") != 1 or value.count(\"</think>\") != 1:\n            raise ValueError(\"\
          invalid reasoning wrapper\")\n        end = value.find(\"</think>\")\n \
          \       value = value[end + len(\"</think>\"):].strip()\n    if not value.startswith(\"\
          {\"):\n        raise ValueError(\"expected JSON object\")\n    parsed =\
          \ json.loads(value)\n    if not isinstance(parsed, dict):\n        raise\
          \ ValueError(\"expected JSON object\")\n    return parsed\nTOOLS = {\"kb_search\"\
          , \"web_search\", \"calculator\"}\n\ndef main(plan_text: str, question:\
          \ str, java_run_id: str, allowed_tools: str) -> dict:\n    result = {\"\
          status\": \"FAILED\", \"requests\": [], \"answer\": \"\", \"citations\"\
          : [], \"usage\": {}}\n    if not question.strip() or not java_run_id.strip():\n\
          \        return result\n    allowed = set(allowed_tools.split(\",\")) &\
          \ TOOLS\n    try:\n        plan = parse_llm_json(plan_text)\n        tasks\
          \ = plan[\"tasks\"]\n        if not isinstance(tasks, list) or not 1 <=\
          \ len(tasks) <= 4:\n            return result\n        requests = []\n \
          \       for index, task in enumerate(tasks, 1):\n            tool = task[\"\
          tool\"]\n            query = task[\"input\"]\n            if tool not in\
          \ allowed or not isinstance(query, str) or not 1 <= len(query.strip()) <=\
          \ 400:\n                return result\n            requests.append(json.dumps({\"\
          runId\": java_run_id, \"callId\": java_run_id + \":initial:\" + str(index),\
          \ \"tool\": tool, \"input\": query.strip()}, ensure_ascii=False))\n    \
          \    result.update(status=\"READY\", requests=requests)\n    except (ValueError,\
          \ TypeError, KeyError):\n        pass\n    return result\n"
        code_language: python3
        desc: ''

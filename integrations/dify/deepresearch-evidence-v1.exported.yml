    - data:
        code: "import json\n\ndef main(results: list) -> dict:\n    out = {\"status\"\
          : \"FAILED\", \"context\": \"{}\", \"count\": 0, \"answer\": \"\", \"citations\"\
          : [], \"usage\": {}}\n    try:\n        if not isinstance(results, list)\
          \ or not 1 <= len(results) <= 4:\n            return out\n        seen =\
          \ set()\n        evidence = []\n        values = []\n        for raw in\
          \ results:\n            row = json.loads(raw)\n            if row[\"status\"\
          ] != \"OK\":\n                return out\n            for item in row[\"\
          evidences\"]:\n                cid = item[\"citationId\"]\n            \
          \    if cid not in seen:\n                    seen.add(cid)\n          \
          \          evidence.append(item)\n            if row[\"value\"]:\n     \
          \           values.append({\"tool\": row[\"tool\"], \"value\": row[\"value\"\
          ]})\n        evidence = evidence[:16]\n        for index, item in enumerate(evidence,\
          \ 1):\n            item[\"sourceId\"] = \"来源\" + str(index)\n        out.update(status=\"\

    - data:
        code: "import json\n\ndef parse_llm_json(text: str):\n    # DeepSeek can prefix\
          \ the answer with exactly one complete reasoning block.\n    # Everything\
          \ after it must be one JSON object, with no prose or fences.\n    value\
          \ = text.strip()\n    if value.startswith(\"<think>\"):\n        if value.count(\"\
          <think>\") != 1 or value.count(\"</think>\") != 1:\n            raise ValueError(\"\
          invalid reasoning wrapper\")\n        end = value.find(\"</think>\")\n \
          \       value = value[end + len(\"</think>\"):].strip()\n    if not value.startswith(\"\
          {\"):\n        raise ValueError(\"expected JSON object\")\n    parsed =\
          \ json.loads(value)\n    if not isinstance(parsed, dict):\n        raise\
          \ ValueError(\"expected JSON object\")\n    return parsed\nimport re\n\n\
          MARKER = re.compile(r\"\\[来源(\\d+)\\]\")\n\ndef main(synthesis_text: str,\
          \ context: str) -> dict:\n    out = {\"status\": \"FAILED\", \"answer\"\
          : \"\", \"citations\": [], \"usage\": {}}\n    try:\n        allowed = {item[\"\
          citationId\"] for item in json.loads(context)[\"evidences\"]}\n        if\
          \ not allowed:\n            out[\"status\"] = \"INSUFFICIENT_EVIDENCE\"\n\
          \            return out\n        response = parse_llm_json(synthesis_text)\n\
          \        if response.get(\"status\") == \"INSUFFICIENT_EVIDENCE\":\n   \
          \         out[\"status\"] = \"INSUFFICIENT_EVIDENCE\"\n            return\
          \ out\n        if response.get(\"status\") != \"SUCCEEDED\":\n         \
          \   return out\n        answer = response[\"answer\"]\n        citations\
          \ = response[\"citations\"]\n        if not isinstance(answer, str) or not\
          \ answer.strip() or not isinstance(citations, list) or not citations:\n\
          \            return out\n        if len(citations) != len(set(citations))\
          \ or not set(citations).issubset(allowed):\n            return out\n   \
          \     markers = [int(item) for item in MARKER.findall(answer)]\n       \
          \ if not markers or any(item < 1 or item > len(citations) for item in markers):\n\
          \            return out\n        first = list(dict.fromkeys(markers))\n\
          \        if first != list(range(1, len(citations) + 1)):\n            return\
          \ out\n        out.update(status=\"SUCCEEDED\", answer=answer.strip(), citations=citations)\n\
          \    except (ValueError, TypeError, KeyError, AttributeError):\n       \
          \ pass\n    return out\n"

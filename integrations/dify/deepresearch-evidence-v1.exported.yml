    - data:
        code: "import json\n\ndef main(item: str) -> dict:\n    # Only validation\
          \ code creates items. Recheck before a privileged HTTP call.\n    task =\
          \ json.loads(item)\n    tool = task[\"tool\"]\n    if tool not in (\"kb_search\"\
          , \"web_search\", \"calculator\"):\n        raise ValueError(\"invalid tool\"\
          )\n    body = {key: task[key] for key in (\"runId\", \"callId\", \"input\"\
          )}\n    if any(not isinstance(value, str) or not value for value in body.values()):\n\
          \        raise ValueError(\"invalid task\")\n    return {\"tool\": tool,\
          \ \"body\": json.dumps(body, ensure_ascii=False)}\n"
        code_language: python3

            "type": "code",
            "selected": false,
            "code": "import json\ndef main(tasks: str, fixture_evidence: str) -> dict:\n    try:\n        evidence=json.loads(fixture_evidence or \"[]\")\n        if not isinstance(evidence,list): evidence=[]\n        evidence=evidence[:4]\n        evidence=[e for e in evidence if isinstance(e,dict) and e.get(\"untrusted\") is True and e.get(\"route\")==\"ragflow\"]\n        return {\"evidence\":json.dumps(evidence,ensure_ascii=False)}\n    except Exception:\n        return {\"evidence\":\"[]\"}\n",

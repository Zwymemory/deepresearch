            "type": "code",
            "selected": false,
            "code": "import json\ndef main(verdict: str, evidence: str) -> dict:\n    if verdict!=\"SUFFICIENT\": return {\"status\":\"INSUFFICIENT_EVIDENCE\",\"answer\":\"\",\"citations\":[]}\n    try:\n        rows=json.loads(evidence)\n        citations=[]\n        for e in rows:\n            key=e[\"chunkKey\"]\n            source=\"kb:\"+key\n            if source not in citations: citations.append(source)\n        # Fixture verifies the contract only; no model-generated claims are published.\n        return {\"status\":\"INSUFFICIENT_EVIDENCE\",\"answer\":\"\",\"citations\":[]}\n    except Exception:\n        return {\"status\":\"FAILED\",\"answer\":\"\",\"citations\":[]}\n",

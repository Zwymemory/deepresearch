[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "deepresearch-workflow-service"
version = "0.1.0"
description = "Durable LangGraph workflow sidecar for DeepResearch"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "langchain-openai==1.4.1",
  "langgraph==1.2.10",
  "langgraph-checkpoint-postgres==3.1.1",
  "mcp==1.29.0",
  "psycopg[binary,pool]==3.3.2",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "referencing==0.37.0",
  "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "ruff==0.15.1",
]

[project.scripts]
deepresearch-workflow = "deepresearch_workflow.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepresearch_workflow"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL and a disposable PostgreSQL database"]

[tool.coverage.run]
branch = true
source = ["deepresearch_workflow"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

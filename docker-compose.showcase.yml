# Opt-in RAGFlow + Dify demo. Requires Compose >= 2.24.4 for !override.
# Start with scripts/start-showcase.sh; external RAGFlow/Dify run independently.
name: ${COMPOSE_PROJECT_NAME:-deepresearch-showcase}
services:
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME:-deepresearch-showcase}-pg
    ports: !override
      - "127.0.0.1:${DEEPRESEARCH_PG_PORT:-5432}:5432"

  workflow-db-bootstrap:
    container_name: ${COMPOSE_PROJECT_NAME:-deepresearch-showcase}-db-bootstrap

  app:
    container_name: ${COMPOSE_PROJECT_NAME:-deepresearch-showcase}-app
    networks:
      default:
        aliases: [deepresearch-java]
    environment:
      DEEPRESEARCH_RETRIEVAL_PROVIDER: ragflow
      DEEPRESEARCH_WORKFLOW_ENABLED: "true"
      DEEPRESEARCH_WORKFLOW_ENGINE: dify
      # The selected route does not use the legacy Elasticsearch data plane.
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
    ports: !override
      - "127.0.0.1:${DEEPRESEARCH_APP_PORT:-8080}:8080"
    depends_on: !override
      workflow-db-bootstrap:
        condition: service_completed_successfully

# Dify on native Linux can join this bridge and call the alias without exposing
# Java's anonymous local token issuer to the host network.
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-deepresearch-showcase}-callback

<!doctype html>
<html lang="zh-CN" data-theme="airy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f3e8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DeepResearch · 研究工作台（React 预览 · 示例数据）</title>
    <script>
      // Resolve the theme before first paint: explicit choice (shared with V1) or system preference.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("deepresearch.console.theme"); } catch (e) {}
        var dark = saved === "dark" || (saved !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "mist" : "airy";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

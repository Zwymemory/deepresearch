name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build

  showcase-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify DSL, evaluators and published redacted scores
        run: make showcase-check PYTHON=python
      - name: Install workflow dependencies for native acceptance audit tests
        run: python -m pip install -r workflow-service/requirements.txt
      - name: Verify bounded live admission and model identity observer offline
        run: python -B -m unittest discover -s scripts/tests -p 'test_agent*.py'

  java-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode test

  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Test workflow sidecar
        run: |
          python -m pip install -r workflow-service/requirements-dev.txt
          python -m pip install -e workflow-service
          ruff check workflow-service/src workflow-service/tests
          python -m compileall -q workflow-service/src workflow-service/tests
          python -m pytest workflow-service/tests -m 'not integration'
      - name: Test reranker training utilities
        run: |
          python -m pip install -r reranker-service/requirements-test.txt
          python -m compileall -q reranker-service reranker-service/training reranker-service/tests
          python -m pytest reranker-service/tests

      - name: Validate Compose and public release boundary
        run: |
          docker compose config --quiet
          docker compose --env-file docs/showcase/.env.example -f docker-compose.yml -f docker-compose.showcase.yml config --quiet
          bash scripts/verify-public-release.sh --skip-history

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install workflow Python dependencies for Java integration tests
        run: |
          python -m pip install -r workflow-service/requirements-dev.txt
          python -m pip install -e workflow-service
          echo "AGENT_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: mvn --batch-mode -Pintegration verify

  workflow-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
          POSTGRES_DB: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify PostgreSQL claim fencing and sync checkpoints
        env:
          TEST_DATABASE_URL: postgresql://workflow:workflow@127.0.0.1:5432/workflow
        run: |
          python -m pip install -r workflow-service/requirements-dev.txt
          python -m pip install -e workflow-service
          python -m pytest workflow-service/tests -m integration -vv

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
